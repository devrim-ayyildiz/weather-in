name: weather-in
base: core24
version: '0.1'
summary: console tool to get weather status of a city
description: |
  Fetches and displays current weather information for a specified city
  using the OpenWeatherMap API. It requires an API key stored in ~/.apikey

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots
type: app

platforms:
  amd64:

parts:
  weather-in:
    plugin: python
    source-type: git
    source: https://github.com/devrim-ayyildiz/weather-in
    python-packages:
      - requests

apps:
  weather-in:
    command: bin/python3 ./weather-in.py